name: 24/7 Telegram Video Live

on:
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য
  schedule:
    - cron: '0 */5 * * *' # প্রতি ৫ ঘণ্টা পর পর রিফ্রেশ বা রান করার নিয়ম (প্রয়োজনমতো পরিবর্তন করতে পারেন)

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub-এর একটি জব সর্বোচ্চ ৩৬০ মিনিট বা ৬ ঘণ্টা পর্যন্ত চলতে পারে

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Live Stream with FFmpeg
        env:
          RTMP_SERVER: ${{ secrets.RTMP_URL }}
        run: |
          echo "Starting FFmpeg stream..."
          
          # -stream_loop -1 দিয়ে ভিডিওটি লুপ করা হয়েছে যাতে শেষ না হয়
          ffmpeg -re -stream_loop -1 -i "video.mp4" \
          -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$RTMP_SERVER"
          
