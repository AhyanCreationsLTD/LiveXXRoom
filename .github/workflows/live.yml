name: Telegram Video Live Stream

on:
  workflow_dispatch:
    inputs:
      rtmp_url:
        description: 'Enter Full RTMP URL (e.g., rtmp://a.rtmp.telegram.org/s/...)'
        required: true
        type: string
      stream_key:
        description: 'Enter Telegram Stream Key'
        required: true
        type: string
      video_url:
        description: 'Enter Direct Video Download Link (MP4)'
        required: true
        type: string

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub-এর একটি জব সর্বোচ্চ প্রায় ৬ ঘণ্টা পর্যন্ত চলতে পারে

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget

      - name: Download Video File
        run: |
          echo "Downloading video from provided URL..."
          wget -O input_video.mp4 "${{ inputs.video_url }}"

      - name: Start Live Stream with FFmpeg
        run: |
          echo "Starting FFmpeg live stream to Telegram..."
          
          # কমপ্লিট RTMP URL এবং Stream Key একসাথে যুক্ত করা হচ্ছে
          FULL_RTMP="${{ inputs.rtmp_url }}/${{ inputs.stream_key }}"
          
          # FFmpeg এর মাধ্যমে লুপ স্ট্রিমিং শুরু
          ffmpeg -re -stream_loop -1 -i "input_video.mp4" \
          -c:v libx264 -preset veryfast -b:v 2000k -maxrate 2000k -bufsize 4000k \
          -pix_fmt yuv420p -g 60 \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$FULL_RTMP"
          
